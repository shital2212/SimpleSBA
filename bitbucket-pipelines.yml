image: maven:3.8.4-openjdk-17
pipelines:
  default:
    - step:
        name: Build and Test
        caches:
          - maven
        script:
          - mvn clean install
          - mvn test
        artifacts:
          - target/*.jar
    - step:
        name: Build Docker Image
        services:
          - docker
        script:
          - echo ${DOCKER_PASSWORD} | docker login -u "$DOCKER_USERNAME" --password-stdin
          - docker build -t "$DOCKER_USERNAME"/springbootapp:latest .
          - docker push "$DOCKER_USERNAME"/springbootapp:latest

definitions:
  services:
    docker:
      memory: 1024