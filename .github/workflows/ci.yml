# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
         name: SpringBootApp-0.0.1-SNAPSHOT
         path: target/*.jar
         retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Download the JAR file directly into the target folder
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: SpringBootApp-0.0.1-SNAPSHOT
          path: target

      # [REMOVED DUPLICATE CHECKOUT STEP THAT WIPED OUT THE TARGET FOLDER]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          # FIX: Standardized to ./Dockerfile (Ensure your file in GitHub has a capital D)
          file: ./dockerfile 
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/java-app:latest
            ${{ secrets.DOCKER_USERNAME }}/java-app:${{ github.sha }}
