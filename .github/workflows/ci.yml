name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ==========================================
  # JOB 1: Build and Compile the Java Application
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
    # Pulls the source code from your GitHub repository onto the runner machine
    - uses: actions/checkout@v4
    
    # Configures the required Java Development Kit (JDK) environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Caches Maven dependencies to speed up future workflow runs
        
    # Compiles the Spring Boot code and packages it into a runnable JAR file
    - name: Build with Maven
      run: mvn clean package

    # Saves the compiled JAR file to GitHub's cloud storage so the next job can use it
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
         name: SpringBootApp-0.0.1-SNAPSHOT
         path: target/*.jar # Grabs the generated JAR from the Maven target directory
         retention-days: 5

  # ==========================================
  # JOB 2: Build the Docker Image and Deploy
  # ==========================================
  deploy:
    needs: build # Prevents this job from running until the 'build' job completes successfully
    runs-on: ubuntu-latest
    
    steps:
      # Pulls the source code again to access the Dockerfile and root project context
      - name: Checkout repository
        uses: actions/checkout@v4

      # Retrieves the JAR file saved by the build job and places it back into the target folder
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: SpringBootApp-0.0.1-SNAPSHOT
          path: target # Recreates the target folder so the Dockerfile can find the file

      # Prepares the runner to use advanced Docker features (Buildx)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Authenticates with Docker Hub using secure repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Packages the application into a container image and pushes it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: . # Uses the current directory as the build context
          file: ./Dockerfile # The path to your Docker setup file (Ensure case-sensitivity matches)
          push: true # Automatically pushes the built image to Docker Hub
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/java-app:latest
            ${{ secrets.DOCKER_USERNAME }}/java-app:${{ github.sha }} # Tags with the specific Git commit hash
