# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# .github/dependabot.yml
version: 2
updates:
  # 1. Track Maven (Java) dependencies
  - package-ecosystem: "maven"
    directory: "/" # Looks for pom.xml in the root directory
    schedule:
      interval: "daily" # Checks for updates every day

  # 2. Track GitHub Actions updates (like actions/checkout or docker/build-push-action)
  - package-ecosystem: "github-actions"
    directory: "/" # Looks inside the .github/workflows folder
    schedule:
      interval: "weekly" # Checks for workflow updates every week
